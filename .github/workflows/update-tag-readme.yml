name: Update Readme with Version

on:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Get latest tag
        id: get-tag
        run: |
          git describe --tags --abbrev=0 > tag.txt

      - name: Update Readme
        run: |
          version=$(cat tag.txt)
          sed -i "s/Version: .*$/Version: $version/" README.md

      - name: Commit changes
        run: |
          git add README.md
          git commit -m "Update Readme with version $version"
          git push
