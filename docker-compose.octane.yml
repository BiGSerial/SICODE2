services:
  sicode2-octane:
    build:
      context: .
      dockerfile: docker/octane/Dockerfile

    container_name: sicode2-octane
    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

    ports:
      - "0.0.0.0:8000:8080"

    environment:
      APP_ENV: local
      APP_DEBUG: "true"

      OCTANE_PORT: 8080
      OCTANE_WORKERS: 4
      OCTANE_MAX_REQUESTS: 500

    extra_hosts:
      - "host.docker.internal:host-gateway"
