# Stack efêmera por worktree do Orca. Uso: scripts/orca-worktree-setup.sh
# COMPOSE_PROJECT_NAME e ORCA_HTTP_PORT vêm de .env.orca (gerado pelo setup, não versionado).
services:
  app:
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
    image: sicode2-orca-app:local
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    group_add:
      - "${DOCKER_WWW_GROUP:-33}"
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${ORCA_HTTP_PORT:?rode scripts/orca-worktree-setup.sh}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/orca.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
